# SPDX-License-Identifier: Apache-2.0
# Project rules for contracts/openapi.yaml and contracts/events/*.yaml.
# Run: npm ci --prefix contracts && npm run --prefix contracts lint
# Rules that need contracts/modules.yaml or contracts/surfaces.yaml (tag of a declared module,
# security consistent with the surface, closed webhook list) come as JavaScript functions in
# contracts/spectral-functions/ once those files exist.
extends:
  - spectral:oas
  - spectral:asyncapi

rules:
  # Shared components are a library for the modules: most are unused until a module refers to them.
  oas3-unused-component: off
  # Events go through the outbox of the shared database, without a broker: AsyncAPI documents have no server.
  asyncapi-servers: off
  # No e-mail address is published in the contract: the contact is the repository URL.
  asyncapi-info-contact-properties: off

  # --- Naming
  kicksaas-operation-id-camel-case:
    description: operationId is camelCase; renaming it is a breaking change.
    formats: [oas3]
    severity: error
    given: "$.paths[*][get,put,post,patch,delete].operationId"
    then:
      function: pattern
      functionOptions: { match: "^[a-z][a-zA-Z0-9]{2,80}$" }
  kicksaas-property-snake-case:
    description: Property names are snake_case.
    severity: error
    given: "$..properties"
    then:
      field: "@key"
      function: pattern
      functionOptions: { match: "^[a-z][a-z0-9_]*$" }
  kicksaas-parameter-snake-case:
    description: Query and path parameter names are snake_case.
    formats: [oas3]
    severity: error
    given:
      - "$.components.parameters[?(@.in == 'query' || @.in == 'path')]"
      - "$.paths[*].parameters[?(@.in == 'query' || @.in == 'path')]"
      - "$.paths[*][get,put,post,patch,delete].parameters[?(@.in == 'query' || @.in == 'path')]"
    then:
      field: name
      function: pattern
      functionOptions: { match: "^[a-z][a-z0-9_]*$" }
  kicksaas-enum-upper-snake-case:
    description: Enumeration values of schemas are UPPER_SNAKE_CASE.
    formats: [oas3]
    severity: error
    given: "$.components.schemas..enum[*]"
    then:
      function: pattern
      functionOptions: { match: "^[A-Z][A-Z0-9_]*$" }

  # --- Operations
  kicksaas-path-surface:
    description: Every path belongs to a surface of contracts/surfaces.yaml described by this contract.
    formats: [oas3]
    severity: error
    given: "$.paths"
    then:
      field: "@key"
      function: pattern
      functionOptions: { match: "^/v1/(app|portal|admin|public-api|public)/" }
  kicksaas-operation-one-tag:
    description: Every operation has exactly one tag, the code name of its module.
    formats: [oas3]
    severity: error
    given: "$.paths[*][get,put,post,patch,delete]"
    then:
      field: tags
      function: length
      functionOptions: { min: 1, max: 1 }
  kicksaas-operation-summary:
    description: Every operation has a summary.
    formats: [oas3]
    severity: error
    given: "$.paths[*][get,put,post,patch,delete]"
    then:
      field: summary
      function: truthy
  kicksaas-operation-standard-errors:
    description: Every operation documents 400, 429 and 503.
    formats: [oas3]
    severity: error
    resolved: false
    given: "$.paths[*][get,put,post,patch,delete].responses"
    then:
      - field: "400"
        function: truthy
      - field: "429"
        function: truthy
      - field: "503"
        function: truthy
  kicksaas-post-idempotency-key:
    description: A non-idempotent POST declares the Idempotency-Key header (mark naturally idempotent ones with x-kicksaas-idempotent).
    formats: [oas3]
    severity: error
    resolved: false
    given: "$.paths[*].post[?(@['x-kicksaas-idempotent'] != true)]"
    then:
      - field: parameters
        function: schema
        functionOptions:
          schema:
            type: array
            contains:
              type: object
              required: ["$ref"]
              properties: { "$ref": { const: "#/components/parameters/IdempotencyKey" } }
      - field: responses
        function: schema
        functionOptions:
          schema: { type: object, required: ["409", "422"] }
  kicksaas-request-body-closed:
    description: Request bodies are closed objects (additionalProperties false).
    formats: [oas3]
    severity: error
    given: "$.paths[*][*].requestBody.content[*].schema"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [additionalProperties]
          properties: { additionalProperties: { const: false } }

  # --- Errors
  kicksaas-error-responses-problem-json:
    description: Shared error responses are served as application/problem+json.
    formats: [oas3]
    severity: error
    given: "$.components.responses[*].content"
    then:
      field: application/problem+json
      function: truthy
  kicksaas-retry-after:
    description: 429 and 503 carry Retry-After.
    formats: [oas3]
    severity: error
    given: "$.components.responses[TooManyRequests,ServiceUnavailable]"
    then:
      field: headers.Retry-After
      function: truthy

  # --- Data
  kicksaas-property-classification:
    description: Every property carries its data classification.
    severity: error
    resolved: false
    given: "$..properties[*]"
    then:
      - field: x-kicksaas-classification
        function: truthy
      - field: x-kicksaas-classification
        function: enumeration
        functionOptions: { values: [public, internal, confidential, sensitive, secret] }
  kicksaas-no-card-data:
    description: No payment card member is ever described.
    severity: error
    given: "$..properties"
    then:
      field: "@key"
      function: pattern
      functionOptions: { notMatch: "^(card_number|pan|cvv|cvc|cvv2|cvc2|card_expiry|card_exp_month|card_exp_year|card_security_code)$" }
  kicksaas-amount-not-number:
    description: An amount is a decimal string in a Money object, never a number.
    severity: error
    given: "$..properties.amount"
    then:
      function: schema
      functionOptions:
        schema:
          not: { properties: { type: { enum: [number, integer] } }, required: [type] }
  kicksaas-no-nullable:
    description: OpenAPI 3.1 has no nullable; use a type list with "null".
    severity: error
    given: "$..properties[*]"
    then:
      field: nullable
      function: falsy
  kicksaas-string-bounded:
    description: Free strings are bounded (maxLength), unless an enum, a format, a pattern or a const bounds them.
    formats: [oas3]
    severity: error
    given: "$.components.schemas..properties[?(@.type == 'string' && !@.enum && !@.format && !@.pattern && !@.const)]"
    then:
      field: maxLength
      function: truthy
  kicksaas-array-bounded:
    description: Arrays are bounded (maxItems).
    formats: [oas3]
    severity: error
    given: "$.components.schemas..[?(@.type == 'array')]"
    then:
      field: maxItems
      function: truthy

  # --- References and extensions
  kicksaas-local-refs-only:
    description: References are local; no remote reference is ever followed.
    severity: error
    resolved: false
    given: "$..$ref"
    then:
      function: pattern
      functionOptions: { match: "^(#/|\\./)" }

  kicksaas-no-generator-code-extensions:
    description: No x-python-* or other generator extension that injects code.
    severity: error
    resolved: false
    given: "$..[?(@property.match(/^x-(python|java|typescript|ts|codegen)/))]"
    then:
      function: undefined

  # --- Events
  kicksaas-event-channel-address:
    description: The channel address of an event is its versioned type (ContactCreated.v1).
    formats: [aas3]
    severity: error
    given: "$.channels[*].address"
    then:
      function: pattern
      functionOptions: { match: "^[A-Z][A-Za-z0-9]{2,80}\\.v[1-9][0-9]{0,2}$" }
