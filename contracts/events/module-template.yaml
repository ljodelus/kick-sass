# SPDX-License-Identifier: Apache-2.0
# Template of the AsyncAPI document of a module: copy it to contracts/events/<module>.yaml
# when the module publishes its first event or asynchronous command.
#
# Rules (see contracts/COMPATIBILITY.md):
# - one channel per message type; the channel address is the versioned type (ContactCreated.v1);
# - events are named in the past tense, asynchronous commands in the imperative (NotifyPerson.v1);
# - every message payload is the envelope (./envelope.json) with `type` fixed by `const`
#   and its own `payload` object: identifiers and values only, never an entity or personal data;
# - schemas use the Draft 07 dialect (no $defs, prefixItems or unevaluatedProperties);
# - `x-kicksaas-webhook: true` marks a type exposed to webhooks (closed list, never a security
#   fact); `x-kicksaas-realtime: true` marks a type pushed on the real-time channel;
# - the types a module consumes are declared in contracts/modules.yaml, not here.
asyncapi: 3.1.0
info:
  title: Template module events
  version: 0.1.0
  description: Events published by the module. Replace this text with the module's scope.
  license:
    name: Apache License 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: KickSaaS
    url: https://github.com/ljodelus/kick-sass
  tags:
    - name: template
      description: Replace with the code name of the module.
defaultContentType: application/json
channels: {}
operations: {}
