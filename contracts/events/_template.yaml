# SPDX-License-Identifier: Apache-2.0
# Template of the AsyncAPI document of a module: copy it to contracts/events/<module>.yaml when
# the module publishes its first event or asynchronous command. Files starting with "_" are not
# modules and are left out of the published x consumed table.
#
# Rules (see contracts/COMPATIBILITY.md):
# - one channel per message type; the channel address is the versioned type (ContactCreated.v1);
# - events are named in the past tense, asynchronous commands in the imperative (NotifyPerson.v1);
# - every payload is the envelope (./envelope.json) with `type` and `version` fixed by `const`
#   and its own `payload` object: identifiers and values only, never an entity or personal data;
# - schemas use the Draft 07 dialect (no $defs, prefixItems or unevaluatedProperties);
# - every property carries x-kicksaas-classification;
# - `x-kicksaas-webhook: true` marks a type exposed to webhooks (closed list, never a security
#   fact); `x-kicksaas-realtime: true` marks a type pushed on the real-time channel;
# - `organization_id` is null only for the types of the instance itself;
# - the types a module consumes are declared in contracts/modules.yaml, not here.
#
# Complete example of one published event:
#
# channels:
#   contactCreated:
#     address: ContactCreated.v1
#     messages:
#       ContactCreated.v1:
#         name: ContactCreated.v1
#         summary: A contact was created in an organization.
#         x-kicksaas-webhook: false
#         payload:
#           allOf:
#             - $ref: "./envelope.json"
#             - type: object
#               properties:
#                 type: { const: ContactCreated.v1, x-kicksaas-classification: public }
#                 version: { const: 1, x-kicksaas-classification: public }
#                 organization_id: { type: string, format: uuid, x-kicksaas-classification: internal }
#                 payload:
#                   type: object
#                   x-kicksaas-classification: internal
#                   required: [contact_id, owner_id]
#                   properties:
#                     contact_id: { type: string, format: uuid, x-kicksaas-classification: internal }
#                     owner_id: { type: string, format: uuid, x-kicksaas-classification: internal }
#         examples:
#           - payload:
#               id: 0192f0c1-7c8e-7d3a-9b1e-3f2a1c4d5e70
#               seq: 1042
#               type: ContactCreated.v1
#               version: 1
#               organization_id: 0192f0c1-0000-7000-8000-000000000001
#               aggregate_type: contact
#               aggregate_id: 0192f0c1-7c8e-7d3a-9b1e-3f2a1c4d5e6f
#               occurred_at: "2026-11-20T08:30:00Z"
#               correlation_id: 4bf92f3577b34da6a3ce929d0e0e4736
#               causation_id: null
#               depth: 0
#               payload: { contact_id: 0192f0c1-7c8e-7d3a-9b1e-3f2a1c4d5e6f, owner_id: 0192f0c1-0000-7000-8000-0000000000aa }
# operations:
#   publishContactCreated:
#     action: send
#     channel: { $ref: "#/channels/contactCreated" }
asyncapi: 3.1.0
info:
  title: Template module events
  version: 0.1.0
  description: Events published by the module. Replace this text with the module's scope.
  license:
    name: Apache License 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: KickSaaS
    url: https://github.com/ljodelus/kick-sass
  tags:
    - name: template
      description: Replace with the code name of the module.
defaultContentType: application/json
channels: {}
operations: {}
